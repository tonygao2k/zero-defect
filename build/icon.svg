<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf0a8"/>
      <stop offset="0.5" stop-color="#17a866"/>
      <stop offset="1" stop-color="#075a3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#ffb938"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#001a12" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#00331f" flood-opacity="0.4"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <path d="M100 100h824v250c-160 70-420 90-824 20z" fill="#fff" opacity="0.1"/>
  </g>

  <!-- 对勾 -->
  <path d="M300 530 456 686 740 372" fill="none" stroke="#ffffff" stroke-width="86"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- 橡皮 -->
  <g transform="rotate(-24 760 290)" filter="url(#soft)">
    <rect x="652" y="236" width="224" height="108" rx="34" fill="url(#eraser)"/>
    <rect x="652" y="236" width="82" height="108" rx="34" fill="#ff7a6b"/>
    <rect x="708" y="236" width="26" height="108" fill="#ff7a6b"/>
  </g>
</svg>
